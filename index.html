<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Habit iOS Full Final</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>

/* ===== BODY ===== */
body{
margin:0;
font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
background:#0b1220;
color:white;
}

/* ===== LOGIN ===== */
#login{
position:fixed;
inset:0;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
background:#111827;
z-index:9999;
}

#login input{
padding:12px;
border-radius:12px;
border:none;
width:220px;
margin:10px;
background:rgba(255,255,255,0.08);
color:white;
outline:none;
}

#login button{
padding:10px 16px;
background:#22c55e;
border:none;
border-radius:12px;
cursor:pointer;
font-weight:600;
}

#error{color:#ff4d4d;}

/* ===== APP ===== */
#app{
display:none;
padding-bottom:90px;
}

/* ===== HEADER ===== */
.header{
padding:30px;
text-align:center;
background:linear-gradient(135deg,#0ea5e9,#22c55e);
border-bottom-left-radius:25px;
border-bottom-right-radius:25px;
}

/* ===== SECTION ===== */
.section{
display:none;
padding:15px;
min-height:100vh;
box-sizing:border-box;
}

.active{display:block;}

/* ===== CARD ===== */
.card{
background:rgba(255,255,255,0.06);
border:1px solid rgba(255,255,255,0.08);
padding:12px;
margin:10px;
border-radius:14px;
display:flex;
justify-content:space-between;
align-items:center;
}

/* ===== CHECKBOX ===== */
input[type=checkbox]{
width:18px;
height:18px;
accent-color:#22c55e;
}

/* ===== CALENDAR ===== */
.calendar{
display:grid;
grid-template-columns:repeat(7,1fr);
gap:5px;
}

.day{
text-align:center;
padding:6px;
font-size:11px;
background:rgba(255,255,255,0.05);
border-radius:6px;
}

.today{
background:#22c55e;
color:black;
font-weight:bold;
}

/* ===== PROGRESS ===== */
.bar{
height:12px;
background:rgba(255,255,255,0.08);
border-radius:999px;
overflow:hidden;
}

.fill{
height:100%;
width:0%;
background:#22c55e;
transition:0.3s;
}

/* ===== HISTORY ===== */
.history{
background:rgba(255,255,255,0.06);
padding:10px;
margin:8px;
border-radius:10px;
}

/* ===== NAV IOS PREMIUM ===== */
nav{
position:fixed;
bottom:0;
left:0;
right:0;
height:70px;
display:none;
justify-content:space-around;
align-items:center;
background:rgba(15,23,42,0.9);
backdrop-filter:blur(18px);
border-top:1px solid rgba(255,255,255,0.08);
z-index:999;
}

.nav-btn{
background:none;
border:none;
color:#94a3b8;
display:flex;
flex-direction:column;
align-items:center;
gap:3px;
cursor:pointer;
transition:0.2s;
padding:6px 10px;
}

.nav-btn i{
font-size:24px;
color:#22c55e;
transition:0.2s;
}

.nav-btn span{
font-size:11px;
}

.nav-btn:active{
transform:scale(0.8);
}

.nav-btn:active i{
transform:scale(1.3);
filter:brightness(1.4);
}

.nav-btn.active i{
color:#00ff99;
filter:drop-shadow(0 0 8px #22c55e);
}

</style>
</head>

<body>

<!-- LOGIN -->
<div id="login">
<h2>🔐 Habit Login</h2>
<input type="password" id="pw" placeholder="Password">
<button onclick="login()">Masuk</button>
<p id="error"></p>
</div>

<!-- APP -->
<div id="app">

<div class="header">
<h2>Habit Dashboard</h2>
</div>

<!-- CALENDAR -->
<div id="cal" class="section active"></div>

<!-- CHECKLIST -->
<div id="chk" class="section">

<div class="card">💪 Olahraga pagi <input type="checkbox" class="t"></div>
<div class="card">🥤 Minum asupan <input type="checkbox" class="t"></div>
<div class="card">🍱 Makan siang <input type="checkbox" class="t"></div>
<div class="card">🏃 Olahraga sore <input type="checkbox" class="t"></div>
<div class="card">🚫 Tidak PMO <input type="checkbox" class="t"></div>

</div>

<!-- RECAP -->
<div id="rec" class="section">
<div class="card" style="flex-direction:column;align-items:flex-start;">
<h3>Progress Hari Ini</h3>
<p id="p">0%</p>
<div class="bar"><div class="fill" id="f"></div></div>
</div>
</div>

<!-- HISTORY -->
<div id="his" class="section"></div>

</div>

<!-- NAV -->
<nav id="nav">

<button class="nav-btn active" onclick="setTab(this,'cal')">
<i class="fa-solid fa-calendar-days"></i>
<span>Kal</span>
</button>

<button class="nav-btn" onclick="setTab(this,'chk')">
<i class="fa-solid fa-list-check"></i>
<span>Task</span>
</button>

<button class="nav-btn" onclick="setTab(this,'rec')">
<i class="fa-solid fa-chart-line"></i>
<span>Recap</span>
</button>

<button class="nav-btn" onclick="setTab(this,'his')">
<i class="fa-solid fa-clock-rotate-left"></i>
<span>Hist</span>
</button>

</nav>

<script>

/* ===== LOGIN ===== */
const PASSWORD = "1269";

function login(){
let v = document.getElementById("pw").value;

if(v === PASSWORD){
document.getElementById("login").style.display="none";
document.getElementById("app").style.display="block";
document.getElementById("nav").style.display="flex";
}else{
document.getElementById("error").innerText="Password salah!";
}
}

/* ===== TAB SYSTEM ===== */
function setTab(el,id){

document.querySelectorAll('.section').forEach(s=>s.classList.remove('active'));
document.getElementById(id).classList.add('active');

document.querySelectorAll('.nav-btn').forEach(b=>b.classList.remove('active'));
el.classList.add('active');

}

/* ===== CALENDAR ===== */
const cal = document.getElementById("cal");

const months = [
["Mei 2026",31],
["Juni 2026",30],
["Juli 2026",31],
["Agustus",31],
["September",30],
["Oktober",31],
["November",30],
["Desember",31]
];

months.forEach(m=>{
let box=document.createElement("div");
box.className="card";

let title=document.createElement("h3");
title.innerText=m[0];

let grid=document.createElement("div");
grid.className="calendar";

for(let i=1;i<=m[1];i++){
let d=document.createElement("div");
d.className="day";
d.innerText=i;

if(m[0]==="Mei 2026" && i===30){
d.classList.add("today");
}

grid.appendChild(d);
}

box.appendChild(title);
box.appendChild(grid);
cal.appendChild(box);
});

/* ===== CHECK + RECAP + HISTORY ===== */
let t=document.querySelectorAll(".t");
let hist=JSON.parse(localStorage.getItem("hist")||"[]");

function update(){
let done=0;
t.forEach(x=>{if(x.checked)done++;});
let p=Math.round(done/t.length*100);
document.getElementById("f").style.width=p+"%";
document.getElementById("p").innerText=p+"%";
}

function save(){
let done=0;
t.forEach(x=>{if(x.checked)done++;});
let p=Math.round(done/t.length*100);

hist.unshift({
date:new Date().toLocaleDateString("id-ID"),
p:p
});

localStorage.setItem("hist",JSON.stringify(hist));
render();
}

function render(){
let box=document.getElementById("his");
box.innerHTML="";

hist.forEach(h=>{
let div=document.createElement("div");
div.className="history";
div.innerHTML=`📅 ${h.date} — ${h.p}%`;
box.appendChild(div);
});
}

t.forEach(x=>{
x.addEventListener("change",()=>{
update();
save();
});
});

update();
render();

</script>

</body>
</html>
